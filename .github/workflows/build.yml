name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
        variant: [gui, headless]
        include:
          - os: ubuntu-24.04
            generator: ninja
          - os: macos-latest
            generator: ninja
          - os: windows-2022
            generator: vs

    env:
      PRESET: ${{ matrix.generator }}${{ matrix.variant == 'headless' && '-headless' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
          ninja-build cmake pkg-config
          libwayland-dev wayland-protocols libxcb1-dev

      - name: Setup macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake --preset $PRESET

      - name: Build
        shell: bash
        run: cmake --build --preset $PRESET --config Release

      # The macOS plugin is a bundle, which is a directory
      - name: Archive artifact
        if: matrix.variant == 'gui'
        shell: bash
        run: tar -cvJf clap-plugins.clap.tar.xz -C builds/$PRESET/plugins/Release clap-plugins.clap

      - name: Upload artifact
        if: matrix.variant == 'gui'
        uses: actions/upload-artifact@v4
        with:
          name: clap-plugins-${{ runner.os }}-${{ runner.arch }}.tar.xz
          path: clap-plugins.clap.tar.xz
